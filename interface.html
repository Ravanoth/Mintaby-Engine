<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mintaby</title>
    <link rel="icon" type="png/jpeg" href="favicon.png">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #0d0d0d;
    --text: #ffffff;
    --panel-bg: #1a1a1a;
    --bubble-user: #10a37f;
    --bubble-assistant: #2a2a2a;
    --border: #333333;
    --code-bg: #141414;
    --code-text: #f8f8f2;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
}

.container {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

.chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.message {
    display: flex;
    gap: 12px;
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.user {
    justify-content: flex-end;
}

.message-content {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 15px;
}

.message.assistant .message-content {
    background: var(--bubble-assistant);
    border: 1px solid var(--border);
}

.message.user .message-content {
    background: var(--bubble-user);
    color: #fff;
}

.input-area {
    padding: 20px;
    border-top: 1px solid var(--border);
    background: var(--bg);
}

.input-wrapper {
    display: flex;
    gap: 12px;
    max-width: 800px;
    margin: 0 auto;
}

#messageInput {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    max-height: 100px;
}

#messageInput:focus {
    outline: none;
    border-color: #10a37f;
    box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.1);
}

#sendBtn {
    padding: 12px 24px;
    background: #10a37f;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    transition: background 0.2s;
}

#sendBtn:hover {
    background: #0d8a6d;
}

#sendBtn:disabled {
    background: #ccc;
    cursor: not-allowed;
}

.welcome-message {
    text-align: center;
    color: var(--text);
    opacity: 0.7;
    padding: 80px 20px 40px 20px;
}

.welcome-message h2 {
    font-size: 28px;
    margin-bottom: 12px;
    color: var(--text);
    font-weight: 700;
}

/* Code block styles */
.code-box {
    background: var(--code-bg);
    border-radius: 8px;
    margin: 12px 0;
    overflow: hidden;
    border: 1px solid var(--border);
    font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
}
.code-header {
    background: rgba(0,0,0,0.15);
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #888;
}
.copy-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: #aaa;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.2s;
}
.copy-btn:hover {
    background: #10a37f;
    color: #fff;
    border-color: #10a37f;
}
.code-box pre {
    padding: 14px;
    overflow-x: auto;
    margin: 0;
    color: var(--code-text);
    font-size: 13px;
    line-height: 1.5;
}
</style>
</head>
<body>
    
    <div class="container">
        <div class="chat-area">
            <div class="messages" id="messagesContainer">
                <div class="welcome-message" id="welcomeMessage">
                    <h2>Mintaby</h2>
                    <p>Local AI Engine active. Type your query below to begin.</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="messageInput" placeholder="Send a message to Mintaby..." rows="1"></textarea>
                    <button id="sendBtn" onclick="sendPromptRequest()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById("messagesContainer");
        const welcomeMessage = document.getElementById("welcomeMessage");
        const messageInput = document.getElementById("messageInput");
        const sendBtn = document.getElementById("sendBtn");

        messageInput.addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight) + "px";
        });

        messageInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendPromptRequest();
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            messageInput.focus();
        });

        function parseMarkdownToHtml(text) {
            const parts = text.split(/```/g);
            let resultHtml = "";

            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 1) {
                    const blockContent = parts[i];
                    const firstLineBreak = blockContent.indexOf("\n");
                    let lang = "code";
                    let code = blockContent;

                    if (firstLineBreak !== -1) {
                        const parsedLang = blockContent.substring(0, firstLineBreak).trim();
                        if (parsedLang) lang = parsedLang;
                        code = blockContent.substring(firstLineBreak + 1);
                    }

                    const escapedCode = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    resultHtml += `
                        <div class="code-box">
                            <div class="code-header">
                                <span class="code-lang">${lang}</span>
                                <button class="copy-btn" onclick="copyCodePayload(this)">Copy</button>
                            </div>
                            <pre><code>${escapedCode}</code></pre>
                        </div>`;
                } else {
                    resultHtml += parts[i].replace(/\n/g, "<br>");
                }
            }
            return resultHtml;
        }

        window.copyCodePayload = function(buttonElement) {
            const preContainer = buttonElement.parentElement.nextElementSibling;
            const codeString = preContainer.textContent;
            navigator.clipboard.writeText(codeString).then(() => {
                buttonElement.innerText = "Copied!";
                setTimeout(() => { buttonElement.innerText = "Copy"; }, 2000);
            });
        };

        async function sendPromptRequest() {
            const promptValue = messageInput.value.trim();
            if (!promptValue) return;

            if (welcomeMessage) welcomeMessage.remove();

            const userDiv = document.createElement("div");
            userDiv.className = "message user";
            userDiv.innerHTML = `<div class="message-content">${promptValue.replace(/\n/g, "<br>")}</div>`;
            messagesContainer.appendChild(userDiv);

            messageInput.value = "";
            messageInput.style.height = "auto";
            messageInput.disabled = true;
            sendBtn.disabled = true;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            const assistantDiv = document.createElement("div");
            assistantDiv.className = "message assistant";
            const assistantContent = document.createElement("div");
            assistantContent.className = "message-content";
            assistantContent.innerText = "Thinking...";
            assistantDiv.appendChild(assistantContent);
            messagesContainer.appendChild(assistantDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                const response = await fetch("http://127.0.0", {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: promptValue })
                });

                if (!response.ok) throw new Error("Connection failed");

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let completeResponseBuffer = "";
                assistantContent.innerHTML = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    completeResponseBuffer += decoder.decode(value, { stream: true });
                    assistantContent.innerHTML = parseMarkdownToHtml(completeResponseBuffer);
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            } catch (error) {
                assistantContent.innerText = "Error: Cannot connect to the local Mintaby background server. Ensure 'node index.js' is currently active in your terminal.";
                console.error(error);
            } finally {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }
    </script>
</body>
</html>
