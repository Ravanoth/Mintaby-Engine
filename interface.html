<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mintaby</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg: #0d0d0d; --text: #ffffff; --panel-bg: #1a1a1a; --bubble-user: #10a37f; --bubble-assistant: #2a2a2a; --border: #333333; --code-bg: #141414; --code-text: #f8f8f2; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); }
.container { display: flex; flex-direction: column; height: 100vh; }
.chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.message { display: flex; gap: 12px; animation: slideIn 0.3s ease; }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.message.user { justify-content: flex-end; }
.message-content { max-width: 70%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 15px; }
.message.assistant .message-content { background: var(--bubble-assistant); border: 1px solid var(--border); }
.message.user .message-content { background: var(--bubble-user); color: #fff; }
.input-area { padding: 20px; border-top: 1px solid var(--border); background: var(--bg); }
.input-wrapper { display: flex; gap: 12px; max-width: 800px; margin: 0 auto; }
#messageInput { flex: 1; padding: 12px 16px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; font-size: 15px; font-family: inherit; resize: none; max-height: 100px; }
#messageInput:focus { outline: none; border-color: #10a37f; }
#sendBtn { padding: 12px 24px; background: #10a37f; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; }
#sendBtn:disabled { background: #ccc; cursor: not-allowed; }
.welcome-message { text-align: center; opacity: 0.7; padding: 80px 20px 40px 20px; }
.welcome-message h2 { font-size: 28px; margin-bottom: 12px; font-weight: 700; }
.code-box { background: var(--code-bg); border-radius: 8px; margin: 12px 0; overflow: hidden; border: 1px solid var(--border); font-family: monospace; }
.code-header { background: rgba(0,0,0,0.15); padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #888; }
.copy-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #aaa; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
.copy-btn:hover { background: #10a37f; color: #fff; }
.code-box pre { padding: 14px; overflow-x: auto; margin: 0; color: var(--code-text); font-size: 13px; }
.loading-wrapper { display: flex; align-items: center; gap: 12px; }
.hexagon-spinner { width: 24px; height: 24px; animation: hexTwirl 2.5s linear infinite, hexPulse 1.8s ease-in-out infinite; }
.hexagon-spinner polygon { fill: none; stroke: #10a37f; stroke-width: 2; stroke-dasharray: 12, 6; }
.loading-text { font-size: 14px; color: #aaa; }
@keyframes hexTwirl { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes hexPulse { 0%, 100% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.1); opacity: 1; } }
</style>
</head>
<body>
    <div class="container">
        <div class="chat-area">
            <div class="messages" id="messagesContainer">
                <div class="welcome-message" id="welcomeMessage">
                    <h2>Mintaby</h2>
                    <p>Local AI Engine active. Type your query below to begin.</p>
                </div>
            </div>
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="messageInput" placeholder="Send a message to Mintaby..." rows="1"></textarea>
                    <button id="sendBtn" onclick="sendPromptRequest()">Send</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const messagesContainer = document.getElementById("messagesContainer");
        const welcomeMessage = document.getElementById("welcomeMessage");
        const messageInput = document.getElementById("messageInput");
        const sendBtn = document.getElementById("sendBtn");

        messageInput.addEventListener("input", function() { this.style.height = "auto"; this.style.height = (this.scrollHeight) + "px"; });
        messageInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                if (!e.shiftKey && !sendBtn.disabled) sendPromptRequest();
            }
        });

        function parseMarkdownToHtml(text) {
            const parts = text.split(/```/g);
            let html = "";
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 1) {
                    const block = parts[i];
                    const breakIdx = block.indexOf("
");
                    let lang = "code", code = block;
                    if (breakIdx !== -1) { lang = block.substring(0, breakIdx).trim() || "code"; code = block.substring(breakIdx + 1); }
                    html += `<div class="code-box"><div class="code-header"><span>\${lang}</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>\${code.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</code></pre></div>`;
                } else { html += parts[i].replace(/\n/g, "<br>"); }
            }
            return html;
        }

        window.copyCode = function(btn) {
            navigator.clipboard.writeText(btn.parentElement.nextElementSibling.textContent).then(() => {
                btn.innerText = "Copied!";
                setTimeout(() => { btn.innerText = "Copy"; }, 2000);
            });
        };

        async function sendPromptRequest() {
            const val = messageInput.value.trim();
            if (!val || sendBtn.disabled) return;
            if (welcomeMessage) welcomeMessage.remove();

            const uDiv = document.createElement("div"); uDiv.className = "message user"; uDiv.innerHTML = `<div class="message-content">\${val.replace(/\n/g, "<br>")}</div>`;
            messagesContainer.appendChild(uDiv);

            messageInput.value = ""; messageInput.style.height = "auto"; messageInput.disabled = true; sendBtn.disabled = true;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            const aDiv = document.createElement("div"); aDiv.className = "message assistant";
            const aContent = document.createElement("div"); aContent.className = "message-content";
            aContent.innerHTML = `<div class="loading-wrapper"><svg class="hexagon-spinner" viewBox="0 0 24 24"><polygon points="12,2 22,7.5 22,18.5 12,24 2,18.5 2,7.5"/></svg><span class="loading-text">Mintaby is writing...</span></div>`;
            aDiv.appendChild(aContent); messagesContainer.appendChild(aDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                const res = await fetch("http://127.0.0.1:3000/api/chat", { method: "POST", mode: "cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: val }) });
                if (!res.ok) throw new Error();
                const reader = res.body.getReader(), dec = new TextDecoder("utf-8");
                let raw = "", rend = "", finished = false;
                aContent.innerHTML = "";

                const clock = setInterval(() => {
                    if (rend.length < raw.length) {
                        rend += raw.substr(rend.length, 6);
                        aContent.innerHTML = parseMarkdownToHtml(rend);
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    } else if (finished) { clearInterval(clock); messageInput.disabled = false; sendBtn.disabled = false; messageInput.focus(); }
                }, 12);

                while (true) { const { done, value } = await reader.read(); if (done) { finished = true; break; } raw += dec.decode(value, { stream: true }); }
            } catch { aContent.innerText = "Error connecting to local server."; messageInput.disabled = false; sendBtn.disabled = false; }
        }
    </script>
</body>
</html>
