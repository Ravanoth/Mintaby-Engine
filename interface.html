<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mintaby Engine</title>
    <link rel="icon" type="png/jpeg" href="favicon.png">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #ffffff;
    --text: #0d0d0d;
    --panel-bg: #ffffff;
    --bubble-user: #10a37f;
    --bubble-assistant: #f7f7f8;
    --border: #d1d5db;
    --code-bg: #1e1e1e;
    --code-text: #f8f8f2;
}

body.dark-mode {
    --bg: #0d0d0d;
    --text: #ffffff;
    --panel-bg: #1a1a1a;
    --bubble-user: #10a37f;
    --bubble-assistant: #2a2a2a;
    --border: #333333;
    --code-bg: #141414;
    --code-text: #f8f8f2;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.3s ease, color 0.3s ease;
}

.container {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

.header {
    text-align: center;
    padding: 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
}

.header h1 {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
}

.header p {
    color: var(--text);
    opacity: 0.7;
    font-size: 14px;
}

.chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.message {
    display: flex;
    gap: 12px;
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.user {
    justify-content: flex-end;
}

.message-content {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 15px;
    transition: background 0.3s ease, color 0.3s ease;
}

.message.assistant .message-content {
    background: var(--bubble-assistant);
    border: 1px solid var(--border);
}

.message.user .message-content {
    background: var(--bubble-user);
    color: #fff;
}

.input-area {
    padding: 20px;
    border-top: 1px solid var(--border);
    background: var(--bg);
}

.input-wrapper {
    display: flex;
    gap: 12px;
    max-width: 800px;
    margin: 0 auto;
}

#messageInput {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    max-height: 100px;
    transition: background 0.3s ease, color 0.3s ease;
}

#messageInput:focus {
    outline: none;
    border-color: #10a37f;
    box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.1);
}

#sendBtn {
    padding: 12px 24px;
    background: #10a37f;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    transition: background 0.2s;
}

#sendBtn:hover {
    background: #0d8a6d;
}

#sendBtn:disabled {
    background: #ccc;
    cursor: not-allowed;
}

.welcome-message {
    text-align: center;
    color: var(--text);
    opacity: 0.7;
    padding: 40px 20px;
}

.welcome-message h2 {
    font-size: 24px;
    margin-bottom: 12px;
    color: var(--text);
}

.floating-buttons {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    flex-direction: row;
    gap: 12px;
    z-index: 9999;
}

.circle-btn {
    width: 42px;
    height: 42px;
    background: var(--bubble-assistant);
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, border 0.3s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    position: relative;
}

.circle-btn:hover {
    background: var(--border);
}

.circle-btn svg {
    display: block;
    transition: stroke 0.2s ease;
}

.circle-btn:hover svg {
    stroke: #10a37f;
}

.circle-btn::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel-bg);
    color: var(--text);
    padding: 6px 10px;
    font-size: 12px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}

.circle-btn:hover::after {
    opacity: 1;
}

.settings-panel {
    position: fixed;
    top: 0;
    right: -300px;
    width: 300px;
    height: 100vh;
    background: var(--panel-bg);
    border-left: 1px solid var(--border);
    box-shadow: -2px 0 8px rgba(0,0,0,0.08);
    padding: 60px 20px 20px 20px;
    transition: right 0.3s ease, background 0.3s ease;
    z-index: 999999999;
}

.settings-panel.open {
    right: 0;
}

.settings-panel h2,
.settings-panel p {
    color: var(--text);
}

.close-btn {
    background: none;
    border: 1px solid var(--border);
    cursor: pointer;
    padding: 6px;
    position: absolute;
    top: 12px;
    right: 12px;
    border-radius: 6px;
    transition: background 0.2s, border 0.2s;
}

.close-btn:hover {
    background: #f0f0f0;
}

.close-btn svg {
    display: block;
    transition: stroke 0.2s ease;
}

.close-btn:hover svg {
    stroke: #10a37f;
}
    
@keyframes twirl {
    0% { transform: rotate(0deg); }
    60% { transform: rotate(200deg); }
    100% { transform: rotate(180deg); }
}

.circle-btn.twirl svg {
    animation: twirl 0.45s ease;
}

.setting-item {
    margin-top: 20px;
}

.toggle {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
}

.toggle input {
    display: none;
}

.slider {
    width: 40px;
    height: 20px;
    background: var(--border);
    border-radius: 20px;
    position: relative;
    transition: background 0.3s ease;
}

.slider::before {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    background: var(--bg);
    border-radius: 50%;
    top: 2px;
    left: 2px;
    transition: transform 0.3s ease, background 0.3s ease;
}

.toggle input:checked + .slider {
    background: #10a37f;
}

.toggle input:checked + .slider::before {
    transform: translateX(20px);
}

.label-text {
    font-size: 14px;
    color: var(--text);
}

body.dark-mode .circle-btn svg {
    stroke: #ffffff;
}

body.dark-mode .circle-btn:hover svg {
    stroke: #10a37f;
}
    
body.dark-mode .close-btn {
    border-color: #555;
}

body.dark-mode .close-btn svg {
    stroke: #ffffff;
}

body.dark-mode .close-btn:hover svg {
    stroke: #10a37f;
}

df-messenger {
    display: none !important;
}

/* --- Added Code Box and Formatting Styles --- */
.code-box {
    background: var(--code-bg);
    border-radius: 8px;
    margin: 10px 0;
    overflow: hidden;
    border: 1px solid var(--border);
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
}
.code-header {
    background: rgba(0,0,0,0.2);
    padding: 6px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #888;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}
.code-lang {
    text-transform: uppercase;
    font-weight: 600;
}
.copy-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: #aaa;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.2s;
}
.copy-btn:hover {
    background: #10a37f;
    color: #fff;
    border-color: #10a37f;
}
.code-box pre {
    padding: 12px;
    overflow-x: auto;
    margin: 0;
    color: var(--code-text);
    font-size: 13.5px;
    line-height: 1.4;
}
    
</style>
</head>
